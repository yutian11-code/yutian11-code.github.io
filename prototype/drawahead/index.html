<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>画见未来 · 原型 v2</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js"></script>

<style>
:root{
  --paper:#FCF7F0;
  --paper-2:#F6ECDF;
  --card:#FFFDFA;
  --ink:#3E2F28;
  --ink-soft:#8A756A;
  --rose:#E88374;
  --rose-deep:#D9695A;
  --rose-wash:#FBE7E1;
  --peach:#F4B98E;
  --gold:#F0B24A;
  --mint:#7FBE96;
  --mint-deep:#5C9A73;
  --mint-wash:#E7F1EA;
  --guide:#6FA8B8;
  --line:#EADFD2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:
    radial-gradient(1200px 800px at 15% -5%, #FBEbe0 0%, transparent 55%),
    radial-gradient(1000px 700px at 100% 110%, #F4E7D6 0%, transparent 50%),
    var(--paper);
  font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:32px 16px;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;}
.tag{
  font-size:13px;color:var(--ink-soft);letter-spacing:.01em;line-height:1.6;
  display:flex;align-items:center;gap:8px;text-align:center;max-width:400px;
}
.tag b{color:var(--rose-deep);}

/* nav pills for demo jumping */
.nav{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:420px;}
.nav button{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:12px;cursor:pointer;
  transition:.15s;
}
.nav button.on{background:var(--rose-deep);color:#fff;border-color:var(--rose-deep);}

/* ---------- phone ---------- */
.phone{
  width:390px;height:824px;border-radius:52px;
  background:#2B211C;
  padding:13px;
  box-shadow:0 40px 90px -30px rgba(62,47,40,.55), 0 0 0 2px rgba(255,255,255,.04) inset;
  position:relative;
}
.screen{
  width:100%;height:100%;border-radius:40px;overflow:hidden;
  background:var(--paper);position:relative;display:flex;flex-direction:column;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:130px;height:30px;background:#2B211C;border-radius:0 0 18px 18px;z-index:40;}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:30;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;
  font-size:13px;font-weight:600;color:var(--ink);pointer-events:none;}
.statusbar .dots{display:flex;gap:5px;align-items:center;}

/* ---------- generic ---------- */
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
.scroll{flex:1;overflow-y:auto;padding-bottom:24px;}
.scroll::-webkit-scrollbar{display:none;}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;}
.btn{
  border:none;font-family:inherit;cursor:pointer;font-weight:800;
  border-radius:20px;transition:transform .12s ease, box-shadow .2s ease, background .2s;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(180deg,var(--rose) 0%,var(--rose-deep) 100%);
  color:#fff;padding:17px;font-size:17px;width:100%;
  box-shadow:0 14px 26px -12px rgba(217,105,90,.75);
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-mint{
  background:linear-gradient(180deg,var(--mint) 0%,var(--mint-deep) 100%);
  color:#fff;padding:17px;font-size:17px;width:100%;
  box-shadow:0 14px 26px -12px rgba(92,154,115,.7);
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-ghost{background:var(--card);color:var(--rose-deep);border:1.5px solid var(--rose-wash);
  padding:15px;font-size:16px;width:100%;}
.rowbtns{display:flex;gap:12px;}
.rowbtns .btn{flex:1;}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:64px 22px 4px;}
.brand .logo{width:42px;height:42px;border-radius:14px;
  background:linear-gradient(150deg,var(--peach),var(--rose));
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px rgba(217,105,90,.7);}
.brand h1{font-size:21px;}
.brand .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.streak{margin-left:auto;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:7px 12px;font-size:13px;font-weight:800;color:var(--gold);
  display:flex;align-items:center;gap:5px;}
.hero-q{padding:22px 22px 6px;}
.hero-q .k{font-size:13px;font-weight:800;color:var(--rose-deep);letter-spacing:.04em;}
.hero-q h2{font-size:26px;line-height:1.34;margin-top:9px;}
.hero-q h2 .u{background:linear-gradient(transparent 62%,var(--gold) 62%);padding:0 2px;}
.idea-cta{
  margin:16px 22px 0;background:var(--card);border:1.5px dashed var(--rose);border-radius:24px;
  padding:20px 18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 16px 32px -22px rgba(217,105,90,.5);
}
.idea-cta:active{transform:scale(.98);}
.idea-cta .big{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px;}
.idea-cta .small{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.section-t{font-size:13.5px;font-weight:800;color:var(--ink-soft);
  padding:24px 22px 12px;display:flex;align-items:center;gap:8px;}
.section-t .more{margin-left:auto;color:var(--rose-deep);font-size:12.5px;}
.mywork-row{display:flex;gap:12px;padding:0 22px;overflow-x:auto;}
.mywork-row::-webkit-scrollbar{display:none;}
.mywork{flex:0 0 auto;width:112px;}
.mywork .pic{width:112px;height:112px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px -16px rgba(62,47,40,.5);}
.mywork .cap{font-size:12px;font-weight:700;margin-top:7px;color:var(--ink);}
.mywork .sub{font-size:11px;color:var(--ink-soft);}
.tagline{margin:22px 22px 8px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.6;}
.tagline b{color:var(--mint-deep);}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:60px 20px 8px;}
.iconbtn{width:38px;height:38px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.topbar .ttl{font-weight:800;font-size:16px;}
.topbar .step{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:700;
  background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:11px;}

/* ---------- canvas ---------- */
.canvas-wrap{flex:1;margin:8px 20px 0;border-radius:28px;min-height:0;
  background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;
  box-shadow:0 20px 40px -30px rgba(62,47,40,.4);}
.canvas-paper{position:absolute;inset:0;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:22px 22px;background-position:6px 6px;opacity:.55;}
.hint-bubble{position:absolute;left:16px;right:16px;bottom:14px;z-index:5;
  background:rgba(62,47,40,.9);color:#fff;border-radius:18px;padding:12px 15px;
  font-size:13px;line-height:1.55;display:flex;gap:10px;align-items:flex-start;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.5);}
.hint-bubble .em{color:var(--gold);font-weight:800;}
.artstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.artstage svg{width:80%;height:80%;overflow:visible;}

.draw-path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:draw 1s ease forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}

.layer{position:absolute;inset:0;transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1);}
.sketch-out{opacity:0;transform:scale(.9) rotate(-2deg);}
.finished-in{opacity:1 !important;transform:scale(1) !important;}
.finished-pre{opacity:0;transform:scale(1.04);}

/* ---------- idea input ---------- */
.saybar{margin:12px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;}
.saybar .mic{width:44px;height:44px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--rose),var(--rose-deep));display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px -8px rgba(217,105,90,.7);}
.saybar .txt .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
.saybar .txt .val{font-size:16px;font-weight:800;margin-top:2px;}

/* ---------- reveal ---------- */
.reveal-head{padding:60px 24px 2px;text-align:center;}
.reveal-head .k{font-size:13px;font-weight:800;color:var(--rose-deep);letter-spacing:.06em;}
.reveal-head h2{font-size:23px;margin-top:8px;line-height:1.34;}
.reveal-head h2 .u{background:linear-gradient(transparent 60%,var(--mint-wash) 60%);}
.compare{display:flex;gap:10px;padding:14px 22px 0;align-items:stretch;}
.mini{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:10px;display:flex;flex-direction:column;gap:7px;}
.mini .lbl{font-size:11px;font-weight:800;color:var(--ink-soft);text-align:center;}
.mini .box{height:104px;border-radius:13px;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mini.future{border-color:var(--mint);box-shadow:0 16px 32px -20px rgba(92,154,115,.55);}
.mini.future .lbl{color:var(--mint-deep);}
.arrowmid{display:flex;align-items:center;color:var(--mint);font-weight:900;font-size:20px;}
.reach-note{margin:14px 22px 0;background:var(--mint-wash);border:1px solid #CFE6D7;border-radius:16px;
  padding:12px 15px;font-size:12.5px;line-height:1.55;color:var(--mint-deep);display:flex;gap:9px;align-items:flex-start;}
.reach-note b{color:var(--mint-deep);}
.spark{position:absolute;font-size:18px;pointer-events:none;opacity:0;}
.sparkgo{animation:spark 1.1s ease forwards;}
@keyframes spark{0%{opacity:0;transform:scale(.3) translateY(6px);}
  40%{opacity:1;transform:scale(1.15) translateY(-4px);}100%{opacity:0;transform:scale(.9) translateY(-14px);}}

/* ---------- guide (real paper, fading scaffold) ---------- */
.paper-reminder{margin:8px 20px 0;background:#FFF6E9;border:1px solid #F3E1C0;border-radius:14px;
  padding:10px 14px;font-size:12.5px;font-weight:700;color:#9A7B3C;display:flex;align-items:center;gap:8px;}
.stepbar{display:flex;gap:6px;padding:12px 22px 4px;}
.stepdot{flex:1;height:7px;border-radius:6px;background:var(--line);transition:background .3s;}
.stepdot.on{background:var(--mint);}
.scaffold-meter{display:flex;align-items:center;gap:8px;padding:2px 22px 0;font-size:11.5px;font-weight:800;color:var(--ink-soft);}
.scaffold-meter .dots{display:flex;gap:4px;}
.scaffold-meter .d{width:8px;height:8px;border-radius:50%;background:var(--line);}
.scaffold-meter .d.fill{background:var(--guide);}
.guide-info{padding:8px 24px 4px;text-align:center;}
.guide-info .n{font-size:12px;font-weight:800;color:var(--mint-deep);letter-spacing:.04em;}
.guide-info h3{font-size:19px;margin-top:6px;}
.guide-info p{font-size:13px;color:var(--ink-soft);margin:6px 0 0;line-height:1.55;}
.ghost{transition:opacity .5s;}

/* ---------- photo capture ---------- */
.cam-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 24px 0;position:relative;}
.cam-frame{width:100%;flex:1;max-height:420px;margin-top:10px;border-radius:28px;position:relative;
  background:#2B211C;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:0 22px 44px -26px rgba(0,0,0,.6);}
.cam-corner{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.85);}
.cam-corner.tl{top:16px;left:16px;border-right:none;border-bottom:none;border-radius:8px 0 0 0;}
.cam-corner.tr{top:16px;right:16px;border-left:none;border-bottom:none;border-radius:0 8px 0 0;}
.cam-corner.bl{bottom:16px;left:16px;border-right:none;border-top:none;border-radius:0 0 0 8px;}
.cam-corner.br{bottom:16px;right:16px;border-left:none;border-top:none;border-radius:0 0 8px 0;}
.paper-photo{background:#FFFDF7;border-radius:6px;padding:14px;transform:rotate(-2.2deg);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.55);position:relative;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 21px, #EDE3D2 22px);}
.paper-photo svg{width:200px;height:200px;filter:saturate(.86) contrast(.97);}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.5);
  margin:20px auto 0;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);position:relative;z-index:3;}
.shutter:active{transform:scale(.94);}

/* ---------- reward ---------- */
.reward-view{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:52px 24px 24px;position:relative;overflow:hidden;}
.confetti{position:absolute;width:9px;height:14px;border-radius:3px;top:-20px;opacity:.9;
  animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(880px) rotate(540deg);}}
.trophy-card{background:var(--card);border:1px solid var(--line);border-radius:28px;
  padding:16px;width:100%;box-shadow:0 26px 50px -30px rgba(62,47,40,.5);position:relative;z-index:2;}
.trophy-card .photo{border-radius:18px;background:#FFFDF7;padding:14px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 21px, #EDE3D2 22px);
  display:flex;align-items:center;justify-content:center;}
.trophy-card .photo svg{width:78%;height:210px;filter:saturate(.9) contrast(.97);}
.medal{position:absolute;top:12px;right:12px;background:var(--gold);color:#fff;
  font-size:12px;font-weight:900;padding:6px 11px;border-radius:14px;z-index:3;
  box-shadow:0 8px 16px -8px rgba(240,178,74,.9);}
.reward-view h2{font-size:23px;margin-top:18px;z-index:2;text-align:center;}
.reward-view .sub{font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.55;z-index:2;text-align:center;}
.stat-row{display:flex;gap:9px;margin-top:18px;width:100%;z-index:2;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;}
.stat .v{font-size:15px;font-weight:900;color:var(--mint-deep);line-height:1.25;}
.stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:4px;line-height:1.3;}
.flame-g{transform-origin:120px 150px;opacity:0;}
.flame-on{animation:flameup 1.6s ease forwards;}
@keyframes flameup{0%{opacity:0;transform:scale(.2);}
  35%{opacity:1;transform:scale(1.15);}55%{transform:scale(.95);}75%{transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}

/* ---------- honest paywall ---------- */
.pay{margin:20px 20px 0;background:linear-gradient(180deg,#FFFDFA,#FFF4EA);
  border:1px solid var(--rose-wash);border-radius:24px;padding:18px;z-index:2;
  box-shadow:0 20px 40px -28px rgba(62,47,40,.4);}
.pay .pt{font-size:16px;font-weight:800;}
.pay ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;}
.pay li{font-size:13px;display:flex;gap:9px;align-items:flex-start;color:var(--ink);}
.pay li .ck{color:var(--mint-deep);font-weight:900;flex:0 0 auto;}
.pay .price{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  display:flex;align-items:baseline;gap:8px;}
.pay .price .big{font-size:22px;font-weight:900;color:var(--rose-deep);}
.pay .price .per{font-size:13px;color:var(--ink-soft);font-weight:700;}
.pay .price .yr{margin-left:auto;font-size:12px;color:var(--mint-deep);font-weight:800;
  background:var(--mint-wash);padding:4px 9px;border-radius:9px;}
.pay .trust{margin-top:10px;font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.5;}
.pay .trust b{color:var(--ink);}

/* ---------- parent report ---------- */
.pr-head{padding:58px 24px 4px;}
.pr-head .k{font-size:12.5px;font-weight:800;color:var(--guide);letter-spacing:.05em;
  display:flex;align-items:center;gap:7px;}
.pr-head h2{font-size:23px;margin-top:8px;line-height:1.3;}
.pr-head .wk{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
.pr-card{margin:16px 22px 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;}
.pr-card .h{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.pr-card .desc{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.skill{display:flex;align-items:center;gap:11px;margin-top:14px;}
.skill .ic{width:30px;height:30px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;}
.skill .nm{font-size:13.5px;font-weight:700;}
.skill .st{margin-left:auto;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:10px;}
.st-done{background:var(--mint-wash);color:var(--mint-deep);}
.st-learn{background:#FDF0DC;color:#B4842E;}
.indep{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:16px;padding:0 4px;}
.indep .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;}
.indep .bar{width:100%;max-width:34px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--mint),var(--mint-deep));}
.indep .cl{font-size:10.5px;color:var(--ink-soft);}
.indep .cv{font-size:11px;font-weight:800;color:var(--mint-deep);}
.beforeafter{display:flex;gap:10px;margin-top:14px;}
.ba{flex:1;text-align:center;}
.ba .box{height:88px;border-radius:14px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);}
.ba .cap{font-size:11px;color:var(--ink-soft);margin-top:6px;font-weight:700;}
.pr-quote{margin:16px 22px 0;background:var(--mint-wash);border:1px solid #CFE6D7;border-radius:18px;
  padding:15px 17px;font-size:13.5px;line-height:1.6;color:var(--mint-deep);font-weight:700;display:flex;gap:10px;}
</style>

<div id="root"></div>

<script type="text/babel">
const {useState,useEffect} = React;

/* =========================================================
   手绘 SVG：会喷火的小飞龙（孩子自己的想法）
   ========================================================= */

/* 草稿：孩子随手画的几笔（歪扭、未完成） */
function SketchDragon(){
  return (
    <svg viewBox="0 0 240 240">
      <g fill="none" stroke="#B99C8C" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" opacity=".85">
        {/* 歪歪的身体 */}
        <path d="M118 78 C86 80 74 116 80 152 C86 184 104 196 122 194 C150 190 168 168 164 132 C160 104 146 82 118 80" style={{"--len":460}} className="draw-path"/>
        {/* 一只小翅膀 */}
        <path d="M84 104 C64 92 58 108 74 118" style={{"--len":90,animationDelay:".3s"}} className="draw-path"/>
        {/* 头顶一根刺 */}
        <path d="M116 78 L120 56 L130 76" style={{"--len":70,animationDelay:".5s"}} className="draw-path"/>
        {/* 两个眼睛点 */}
        <circle cx="106" cy="120" r="4.5" fill="#B99C8C" stroke="none"/>
        <circle cx="138" cy="118" r="4.5" fill="#B99C8C" stroke="none"/>
      </g>
    </svg>
  );
}

/* 成品：简单可爱的小飞龙线描 + 上色，分组 g1..g6 用于分步引导
   ghostOpacity: 脚手架强度（越后面越淡） */
function FinishedDragon({revealUpTo=6, ghostOpacity=0, flame=false}){
  const on = (n)=> revealUpTo>=n;
  const dim = {opacity:.12};
  const stroke = "#4E6B57";
  return (
    <svg viewBox="0 0 240 240">
      <defs>
        <linearGradient id="dragonBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#A8DCB8"/><stop offset="1" stopColor="#82C398"/>
        </linearGradient>
        <linearGradient id="dragonFlame" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stopColor="#F0B24A"/><stop offset="1" stopColor="#E88374"/>
        </linearGradient>
      </defs>

          <div className="h">🖼️ 她自己画的（第 1 张 → 第 4 张）</div>
          <div className="beforeafter">
            <div className="ba">
              <div className="box"><svg viewBox="0 0 240 240" style={{width:'70%',height:'70%'}}><SketchDragon/></svg></div>
              <div className="cap">第 1 天</div>
            </div>
            <div className="ba">
              <div className="box"><svg viewBox="0 0 240 240" style={{width:'80%',height:'80%'}}><FinishedDragon revealUpTo={6}/></svg></div>
              <div className="cap">今天</div>
            </div>
          </div>
        </div>

        <div className="pr-quote">
          <span style={{fontSize:18,lineHeight:1}}>💬</span>
          <div>孩子在<b>自己画、自己进步</b>——AI 只帮她看见目标、教她方法，从没替她画。</div>
        </div>

        <div style={{padding:'18px 22px 26px'}}>
          <button className="btn btn-mint" onClick={()=>go('home')}>回首页，再画一个</button>
        </div>
      </div>
    </div>
  );
}

/* ============ App ============ */
const SCREENS={home:Home,idea:Idea,reveal:Reveal,guide:Guide,photo:Photo,reward:Reward,parent:ParentReport};
const NAV=[['home','首页'],['idea','想法'],['reveal','预演'],['guide','跟画'],['photo','拍照'],['reward','完成'],['parent','家长']];
function App(){
  const boot=(new URLSearchParams(location.search).get('screen'))||'home';
  const [screen,setScreen]=useState(boot);
  const go=(s)=>{ setScreen(s); document.querySelector('.screen').scrollTop=0; };
  const S=SCREENS[screen];
  return (
    <div className="stage">
      <div className="tag">高保真原型 v2 · <b>画见未来</b> · 核心循环：想法 → 预演 → 真纸跟画(脚手架递减) → 拍照 → 完成 → 家长报告</div>
      <div className="phone">
        <div className="notch"></div>
        <div className="screen">
          <StatusBar/>
          <S go={go}/>
        </div>
      </div>
      <div className="nav">
        {NAV.map(([k,l])=>(
          <button key={k} className={screen===k?'on':''} onClick={()=>go(k)}>{l}</button>
        ))}
      </div>
      <div className="tag" style={{opacity:.7}}>点上面的胶囊可直接跳到任意一屏 · 完整走一遍从「首页 → 画一个新的想法」开始</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
